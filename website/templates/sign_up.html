{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <h3 class="center">Sign Up</h3>
    <div>
        <label for="email">Email Address</label>
        <input
            type="email"
            class="form"
            id="email"
            name="email"
            placeholder="Enter Email Address"
            autocomplete="email"
            maxlength="150"
            required
        />
    </div>
    <div>
        <label for="fullName">Full Name</label>
        <input
            type="text"
            class="form"
            id="fullName"
            name="fullName"
            placeholder="Enter Full Name"
            autocomplete="name"
            minlength="2"
            maxlength="150"
            required
        />
    </div>
    <div>
        <label for="password1">Password</label>
        <input
            type="password"
            class="form"
            id="password1"
            name="password1"
            placeholder="At least 8 characters"
            autocomplete="new-password"
            minlength="8"
            required
        />
    </div>
    <div>
        <label for="password2">Confirm Password</label>
        <input
            type="password"
            class="form"
            id="password2"
            name="password2"
            placeholder="Re-enter Password"
            autocomplete="new-password"
            minlength="8"
            required
        />
    </div>
    <button type="submit" class="btn">Submit</button>
    <p class="form-footer">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
</form>
{% endblock %}
